name: Portable source regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: EJYDOvO/character-agent-v1
          ref: 82d7bbfe19ade822416837c6aa3c28da98da1937
          path: reference/character
      - run: npm run test:audit
        env:
          DSH_CHARACTER_PROJECT: ${{ github.workspace }}/reference/character
      - run: npm run test:patch
